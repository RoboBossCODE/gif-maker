<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy-First GIF Maker</title>
    <!-- Links to your separate style sheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Pulls the external GIF processing engine safely -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
</head>
<body>

    <div class="card">
        <h1>Offline GIF Maker</h1>
        <p class="subtitle">100% private. No logs. No server uploads.</p>

        <!-- Image Input Selection -->
        <div class="input-group">
            <label>Select Images (PNG, JPG):</label>
            <input type="file" id="imageInput" multiple accept="image/*">
        </div>

        <!-- Speed Controls -->
        <div class="input-group">
            <div class="slider-header">
                <label>Frame Delay (Speed):</label>
                <span id="delayVal">0.2s</span>
            </div>
            <input type="range" id="delayInput" min="0.05" max="1" step="0.05" value="0.2">
        </div>

        <!-- Trigger Button -->
        <button id="generateBtn" disabled>Generate GIF</button>

        <!-- Hidden Output Preview Area -->
        <div id="previewContainer" class="hidden">
            <h2 class="preview-title">Preview (Press & hold to save if button fails)</h2>
            <img id="gifPreview" alt="Your animated GIF">
            <a id="downloadBtn">Download GIF File</a>
        </div>
    </div>

    <!-- Links to your separate logic script -->
    <script src="app.js"></script>
</body>
</html>
